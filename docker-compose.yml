services:
  flask-app:
    image: flask-service          # the image you just built with the CLI
    container_name: flask-app
    ports:
      - "5000:5000"                # host:container
    environment:
      MONGO_HOST: mongodb          # matches the Mongo service name below
      MONGO_PORT: "27017"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"              # optional; lets you inspect the DB from your machine
    volumes:
      - mongo-data:/data/db        # persists database files across container restarts

volumes:
  mongo-data: